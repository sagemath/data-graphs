name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check release tag
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              version = tomllib.load(stream)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag not in {version, f"v{version}"}:
              raise SystemExit(f"release tag {tag!r} does not match version {version!r}")
          PY
      - name: Install build tools
        run: python -m pip install --upgrade build pip twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/sage-data-graphs-smoke
          /tmp/sage-data-graphs-smoke/bin/python -m pip install --no-deps dist/*.whl
          /tmp/sage-data-graphs-smoke/bin/python - <<'PY'
          from sage_data_graphs import (
              DATA_FILES,
              graph_database_connection,
              load_brouwer_database,
              open_resource,
          )

          with graph_database_connection() as connection:
              assert connection.execute("PRAGMA integrity_check").fetchone() == ("ok",)
          assert len(load_brouwer_database()) == 4538
          for name in DATA_FILES:
              with open_resource(name) as stream:
                  assert stream.read(1)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Attach distributions to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sage-data-graphs
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
